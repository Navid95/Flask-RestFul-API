[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-restful-core"
version = "0.2.0"
description = "A framework for building Flask REST APIs without writing repetitive boilerplate."
requires-python = ">=3.10"
dependencies = [
    "Flask==2.3.3",
    "flask-marshmallow==0.15.0",
    "Flask-SQLAlchemy==3.0.5",
    "marshmallow==3.20.1",
    "marshmallow-sqlalchemy==0.29.0",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
test = ["pytest==7.4.2"]

[tool.setuptools.packages.find]
include = ["flask_restful_core*"]
